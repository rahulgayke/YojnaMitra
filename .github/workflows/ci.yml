name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Unit tests
        run: pytest tests/unit --cov=yojanamitra --cov-report=term-missing -q

      - name: Static security scan
        run: bandit -q -r src

      - name: Dependency audit
        run: pip-audit

      - name: Start infrastructure
        run: docker compose up -d postgres redis qdrant

      - name: Wait for infrastructure
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
        run: python scripts/wait_for_services.py

      - name: Integration tests
        env:
          RUN_INTEGRATION: "1"
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          QDRANT_URL: http://localhost:6333
        run: pytest tests/integration -q

      - name: Build API image
        run: docker build -t yojanamitra-api:ci .

      - name: Print infrastructure logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
